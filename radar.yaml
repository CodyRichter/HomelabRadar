# Presence sensor: XIAO ESP32S3 + HLK-LD2450 radar, OLED views switched with a push button.
# Home Assistant connects in over the ESPHome native API.
substitutions:
  # -1 draws the map and L/R labels from the viewpoint of someone facing the radar (mirror view).
  x_sign: "-1"
  # Stacked buttons on the back panel. Swap these if the top button is the one on D1.
  top_pin: GPIO1
  bottom_pin: GPIO2
  # Screen turns off this long after the last tracked person (burn-in protection).
  screen_timeout_ms: "30000"
  # Placeholder network saved by "Wi-Fi setup". It never exists, so the board opens "Radar Setup".
  setup_marker: "radar-wifi-setup-pending"

esphome:
  name: radar
  friendly_name: Radar
  on_boot:
    # Before Wi-Fi starts: if Wi-Fi setup was requested, open "Radar Setup" after 5 s, not 90 s.
    - priority: 600
      then:
        - lambda: |-
            auto pref = global_preferences->make_preference<wifi::SavedWifiSettings>(App.get_config_version_hash(), true);
            wifi::SavedWifiSettings saved{};
            if (pref.load(&saved) && strcmp(saved.ssid, "${setup_marker}") == 0) {
              id(in_setup) = true;
              wifi::global_wifi_component->set_ap_timeout(5000);
              ESP_LOGI("setup", "Wi-Fi setup mode: join 'Radar Setup'");
            }
    - priority: -100
      then:
      # Give the LD2450 time to report its settings before changing them.
      - delay: 10s
      # Bluetooth is on from the factory and lets any nearby phone reconfigure the radar.
      - if:
          condition:
            switch.is_on: radar_bluetooth
          then:
            - switch.turn_off: radar_bluetooth
      # Ignore anything closer than ~2 ft (610 mm): a box in front of the radar as a Filter zone.
      - number.set: {id: zone1_x1, value: -610}
      - number.set: {id: zone1_y1, value: 0}
      - number.set: {id: zone1_x2, value: 610}
      - number.set: {id: zone1_y2, value: 610}
      - select.set: {id: zone_type, option: Filter}
      - delay: 3s
      - logger.log:
          format: "Radar settings: bluetooth=%s zone=%s (%.0f,%.0f)-(%.0f,%.0f) mm"
          args:
            - 'id(radar_bluetooth).state ? "ON" : "OFF"'
            - 'id(zone_type).current_option().c_str()'
            - 'id(zone1_x1).state'
            - 'id(zone1_y1).state'
            - 'id(zone1_x2).state'
            - 'id(zone1_y2).state'

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Light sleep adds latency to every update Home Assistant receives.
  power_save_mode: none
  # Joining any network (after setup-page entry, for example) ends Wi-Fi setup mode.
  on_connect:
    - globals.set: {id: in_setup, value: 'false'}
  # If Skyline is unreachable, or Wi-Fi setup was started, the board opens this network
  # with a page for entering new Wi-Fi details.
  ap:
    ssid: Radar Setup
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# LD2450 on XIAO D7/D6: radar TX -> D7 (GPIO44), radar RX <- D6 (GPIO43)
uart:
  id: ld_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld
  uart_id: ld_uart

sensor:
  - platform: ld2450
    ld2450_id: ld
    target_count:
      id: target_count
      name: Target Count
      filters: &fast
        # The default filters throttle to 1/s. Replace them so every ~90 ms radar frame gets through.
        - timeout:
            timeout: 1s
            value: last
    target_1:
      x:
        id: t1_x
        name: Target 1 X
        internal: true
        filters: *fast
      y:
        id: t1_y
        name: Target 1 Y
        internal: true
        filters: *fast
    target_2:
      x:
        id: t2_x
        name: Target 2 X
        internal: true
        filters: *fast
      y:
        id: t2_y
        name: Target 2 Y
        internal: true
        filters: *fast
    target_3:
      x:
        id: t3_x
        name: Target 3 X
        internal: true
        filters: *fast
      y:
        id: t3_y
        name: Target 3 Y
        internal: true
        filters: *fast

  # Home Assistant gets the nearest person's distance instead of raw positions.
  - platform: template
    id: nearest_distance
    name: Nearest Distance
    unit_of_measurement: ft
    device_class: distance
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      sensor::Sensor *xs[] = {id(t1_x), id(t2_x), id(t3_x)};
      sensor::Sensor *ys[] = {id(t1_y), id(t2_y), id(t3_y)};
      float nearest = NAN;
      for (int i = 0; i < 3; i++) {
        float x = xs[i]->state, y = ys[i]->state;
        if (isnan(x) || isnan(y) || y <= 0) continue;
        float d = sqrtf(x * x + y * y);
        if (isnan(nearest) || d < nearest) nearest = d;
      }
      return nearest / 304.8f;
    filters:
      - or:
          - delta: 0.3
          - heartbeat: 60s

  - platform: wifi_signal
    id: wifi_rssi
    name: Wi-Fi Signal
    update_interval: 60s

  - platform: uptime
    id: uptime_s
    name: Uptime
    internal: true
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP Address
      internal: true

button:
  - platform: restart
    id: restart_btn
    name: Restart
  # Erases saved settings (including Wi-Fi entered on the setup page), then reboots.
  - platform: factory_reset
    id: reset_btn
    name: Factory Reset
    internal: true

switch:
  - platform: ld2450
    ld2450_id: ld
    bluetooth:
      id: radar_bluetooth
      name: Radar Bluetooth

select:
  - platform: ld2450
    ld2450_id: ld
    zone_type:
      id: zone_type
      name: Zone Type
      internal: true

number:
  - platform: ld2450
    ld2450_id: ld
    presence_timeout:
      name: Presence Timeout
    zone_1:
      x1:
        id: zone1_x1
        name: Zone 1 X1
        internal: true
      y1:
        id: zone1_y1
        name: Zone 1 Y1
        internal: true
      x2:
        id: zone1_x2
        name: Zone 1 X2
        internal: true
      y2:
        id: zone1_y2
        name: Zone 1 Y2
        internal: true

binary_sensor:
  - platform: ld2450
    ld2450_id: ld
    has_target:
      id: has_target
      name: Presence

  # Stacked push buttons, each between its pin and GND (internal pull-up).
  # Top: next view. Bottom: screen off now. Either one wakes a sleeping screen.
  - platform: gpio
    id: btn_top
    name: Top Button
    internal: true
    pin: {number: "${top_pin}", mode: INPUT_PULLUP, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_release: [script.execute: combo_release]
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - if:
              condition:
                lambda: 'return !id(combo);'
              then:
                - lambda: |-
                    if (id(panel_on)) id(view) = (id(view) + 1) % 3;
                    id(last_seen_ms) = millis();
                    id(manual_off) = false;
                - script.execute: screen_check
                - component.update: oled

  - platform: gpio
    id: btn_bottom
    name: Bottom Button
    internal: true
    pin: {number: "${bottom_pin}", mode: INPUT_PULLUP, inverted: true}
    filters: [delayed_on_off: 20ms]
    on_release: [script.execute: combo_release]
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - if:
              condition:
                lambda: 'return !id(combo);'
              then:
                - lambda: |-
                    if (id(panel_on)) {
                      id(manual_off) = true;
                    } else {
                      id(last_seen_ms) = millis();
                      id(manual_off) = false;
                    }
                - script.execute: screen_check
                - component.update: oled

  # Both buttons held: release after 5 s reboots, holding 15 s factory-resets.
  - platform: template
    id: both_held
    internal: true
    lambda: 'return id(btn_top).state && id(btn_bottom).state;'
    on_press:
      - lambda: |-
          id(combo) = true;
          id(hold_start_ms) = millis();
          id(last_seen_ms) = millis();
          id(manual_off) = false;
      - script.execute: screen_check
      - script.execute: long_hold
    on_release:
      - script.stop: long_hold
      - if:
          condition:
            lambda: 'return millis() - id(hold_start_ms) >= 5000;'
          then:
            - logger.log: "Both buttons held 5 s: rebooting"
            - button.press: restart_btn

globals:
  - id: view            # 0 = Map, 1 = Status, 2 = Info
    type: int
    initial_value: '0'
  - id: last_seen_ms    # last time a person was tracked or a button pressed
    type: uint32_t
    initial_value: '0'
  - id: manual_off      # bottom button: stay off until the room has been clear
    type: bool
    initial_value: 'false'
  - id: panel_on
    type: bool
    initial_value: 'true'
  - id: combo           # set while both buttons are in use, so their releases aren't clicks
    type: bool
    initial_value: 'false'
  - id: hold_start_ms
    type: uint32_t
    initial_value: '0'
  - id: in_setup        # waiting for new Wi-Fi details on the "Radar Setup" network
    type: bool
    initial_value: 'false'

script:
  # Powers the panel on or off when the wanted state changes.
  - id: screen_check
    mode: queued
    then:
      - lambda: |-
          bool clear_long = millis() - id(last_seen_ms) >= ${screen_timeout_ms};
          if (clear_long) id(manual_off) = false;
          bool want = id(in_setup) || (!clear_long && !id(manual_off));
          if (want == id(panel_on)) return;
          id(panel_on) = want;
          if (want) {
            id(oled).turn_on();
          } else {
            id(oled).turn_off();
            id(view) = 0;  // always wake on the Map
          }

  # 15 s hold: start Wi-Fi setup. In setup mode it cancels instead, back to the built-in network.
  - id: long_hold
    mode: restart
    then:
      - delay: 15s
      - if:
          condition:
            lambda: 'return id(in_setup);'
          then:
            - logger.log: "Both buttons held 15 s: cancelling Wi-Fi setup (factory reset)"
            - button.press: reset_btn
          else:
            - logger.log: "Both buttons held 15 s: starting Wi-Fi setup"
            # Save the placeholder as the Wi-Fi network, as the setup page would, then reboot.
            - lambda: |-
                auto pref = global_preferences->make_preference<wifi::SavedWifiSettings>(App.get_config_version_hash(), true);
                wifi::SavedWifiSettings saved{};
                strncpy(saved.ssid, "${setup_marker}", sizeof(saved.ssid) - 1);
                pref.save(&saved);
                global_preferences->sync();
            - button.press: restart_btn

  # Clears the combo flag shortly after both buttons are up, once their click handlers have run.
  - id: combo_release
    mode: restart
    then:
      - delay: 200ms
      - lambda: |-
          if (!id(btn_top).state && !id(btn_bottom).state) id(combo) = false;

interval:
  - interval: 250ms
    then:
      - lambda: |-
          sensor::Sensor *ys[] = {id(t1_y), id(t2_y), id(t3_y)};
          for (auto *y : ys) {
            if (!isnan(y->state) && y->state > 0) { id(last_seen_ms) = millis(); break; }
          }
      - script.execute: screen_check

# OLED on XIAO D9/D10: SDA D9 (GPIO8), SCL D10 (GPIO9). scan logs every address that answers.
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 26

# Content stays centred: the recessed opening hides the panel's edges and corners.
# Two-colour panel: rows 0-15 are yellow, 16-63 blue. Keep each line of text inside one band.
# Empty target slots report y = 0. Left/right is as seen facing the radar.
display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    # Dimmer panel ages more slowly. Raise if it is hard to read through the opening.
    contrast: 60%
    update_interval: 100ms
    lambda: |-
      if (!id(panel_on)) return;
      const float mm_per_ft = 304.8f;
      // Shift everything by up to 1 px each minute so static lines don't burn in.
      const int shift = (millis() / 60000) % 4;
      const int ox = (shift == 1 || shift == 2) ? 1 : 0;
      const int oy = (shift >= 2) ? 1 : 0;

      // Both buttons held: countdown instead of the current view.
      if (id(both_held).state) {
        float held = (millis() - id(hold_start_ms)) / 1000.0f;
        if (held < 5.0f) {
          it.print(64 + ox, 7 + oy, id(font_small), TextAlign::CENTER, "Hold to reboot");
          it.printf(64 + ox, 30 + oy, id(font_small), TextAlign::CENTER, "Reboot in %d", (int) ceilf(5.0f - held));
          it.rectangle(24 + ox, 42 + oy, 80, 8);
          it.filled_rectangle(24 + ox, 42 + oy, (int) (80 * held / 5.0f), 8);
        } else {
          it.print(64 + ox, 7 + oy, id(font_small), TextAlign::CENTER, "Release = reboot");
          it.printf(64 + ox, 30 + oy, id(font_small), TextAlign::CENTER, id(in_setup) ? "Cancel setup in %d" : "Wi-Fi setup in %d", (int) ceilf(15.0f - held));
          it.rectangle(24 + ox, 42 + oy, 80, 6);
          it.filled_rectangle(24 + ox, 42 + oy, (int) (80 * (held - 5.0f) / 10.0f), 6);
        }
        return;
      }

      // Wi-Fi setup mode: instructions stay up until new details are saved.
      if (id(in_setup)) {
        it.print(64 + ox, 7 + oy, id(font_small), TextAlign::CENTER, "Wi-Fi setup");
        it.print(64 + ox, 25 + oy, id(font_small), TextAlign::CENTER, "Join \"Radar Setup\"");
        it.print(64 + ox, 38 + oy, id(font_small), TextAlign::CENTER, "then 192.168.4.1");
        it.print(64 + ox, 52 + oy, id(font_small), TextAlign::CENTER, "Hold both: cancel");
        return;
      }

      sensor::Sensor *xs[] = {id(t1_x), id(t2_x), id(t3_x)};
      sensor::Sensor *ys[] = {id(t1_y), id(t2_y), id(t3_y)};
      int n = 0;
      float nearest = NAN;
      for (int i = 0; i < 3; i++) {
        float x = xs[i]->state, y = ys[i]->state;
        if (isnan(x) || isnan(y) || y <= 0) continue;
        float d = sqrtf(x * x + y * y);
        if (isnan(nearest) || d < nearest) nearest = d;
        n++;
      }

      if (id(view) == 0) {
        // Map: radar at (64, 51), 1 px = 12 cm, so the 20 ft range reaches the top. Text below.
        const int cx = 64 + ox, cy = 51 + oy;
        const float mm_per_px = 120.0f;
        it.line(cx, cy, cx - 43, cy - 25);  // ±60° edges
        it.line(cx, cy, cx + 43, cy - 25);
        for (int ft = 5; ft <= 20; ft += 5) {
          float r = ft * mm_per_ft / mm_per_px;
          for (float a = -60.0f; a <= 60.0f; a += 240.0f / r) {
            float rad = a * M_PI / 180.0f;
            it.draw_pixel_at(cx + r * sinf(rad), cy - r * cosf(rad));
          }
        }
        for (int i = 0; i < 3; i++) {
          float x = xs[i]->state, y = ys[i]->state;
          if (isnan(x) || isnan(y) || y <= 0) continue;
          it.filled_circle(cx + (int) (${x_sign} * x / mm_per_px), cy - (int) (y / mm_per_px), 3);
        }
        if (n > 0) {
          it.printf(64 + ox, 63, id(font_small), TextAlign::BOTTOM_CENTER, "%d here, %.1f ft", n, nearest / mm_per_ft);
        } else {
          it.print(64 + ox, 63, id(font_small), TextAlign::BOTTOM_CENTER, "Clear");
        }
      } else if (id(view) == 1) {
        // Status: readable from across the room.
        if (n == 0) {
          it.print(64 + ox, 32 + oy, id(font_big), TextAlign::CENTER, "Clear");
        } else {
          it.printf(64 + ox, 34 + oy, id(font_big), TextAlign::CENTER, "%d %s", n, n == 1 ? "person" : "people");
          it.printf(64 + ox, 55 + oy, id(font_small), TextAlign::CENTER, "Nearest %.1f ft", nearest / mm_per_ft);
        }
      } else {
        // Info: network and uptime.
        it.print(64 + ox, 7 + oy, id(font_small), TextAlign::CENTER, id(ip_addr).state.c_str());
        if (!isnan(id(wifi_rssi).state)) {
          it.printf(64 + ox, 27 + oy, id(font_small), TextAlign::CENTER, "Wi-Fi %.0f dBm", id(wifi_rssi).state);
        }
        uint32_t up = isnan(id(uptime_s).state) ? 0 : (uint32_t) id(uptime_s).state;
        it.printf(64 + ox, 40 + oy, id(font_small), TextAlign::CENTER, "Up %ud %uh %um", up / 86400, (up / 3600) % 24, (up / 60) % 60);
        it.print(64 + ox, 53 + oy, id(font_small), TextAlign::CENTER, "Hold both: reboot");
      }
